    <title>Ligue 1</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color:b;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        a {
            color: white;
            text-decoration: none;
        }
        
        a:hover {
            color: white;
            text-decoration: underline;
        }

        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #000032;
            color: black;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 15px 0 25px 0;
        }
        
        .nav-btn {
            background-color: linear-gradient #000032;
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            display: inline-block;
        }
        
        .nav-btn:hover {
            background-color: #000032;
            transform: translateY(-2px);
            box-shadow: #000032;
        }
        
        .nav-btn.active {
            background-color: #000032;
            border-color: white;
        }
        
        
        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .club-card {
            background-color:#000032;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px #000032;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .club-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .club-logo {
            max-width: 100%;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        
        .club-name {
            font-weight: bold;
            color: white;
            font-size: 1rem;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #fff;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .clubs-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            
            h1 {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .clubs-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 15px;
            }
            
            .club-logo {
                height: 100px;
            }

            .nav-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
